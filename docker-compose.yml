services:
  postgres:
    image: postgres:16
    container_name: watchtower-postgres
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
    ports:
      - "5432:5432"
    volumes:
      - watchtower-pgdata:/var/lib/postgresql/data

volumes:
  watchtower-pgdata:
